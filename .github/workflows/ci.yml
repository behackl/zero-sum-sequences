name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plain-python:
    name: Plain Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: python -m pip install --editable . --group dev
      - name: Confirm that Sage is absent
        run: >-
          python -c "import importlib.util;
          assert importlib.util.find_spec('sage') is None"
      - run: python -m pytest

  tutorial:
    name: Tutorial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --editable '.[tutorial]'
      - run: python -m marimo check notebooks/tutorial.py
      - run: python notebooks/tutorial.py

  docs-doctests:
    name: Documentation doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: python -m pip install --editable . --group docs
      # The HTML site is built by Read the Docs; this checks the examples.
      - run: python -m sphinx -E -W --keep-going -b doctest docs docs/_build/doctest

  sage-integration:
    name: Sage integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: python -m pip install --editable '.[sage]' --group dev
      - run: python -m pytest
