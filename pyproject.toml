[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zero-sum-sequences"
version = "0.3.0"
description = "Computations with additive and zero-sum sequences"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Benjamin Hackl" },
]
dependencies = [
  "networkx>=3.2",
]

[project.urls]
Documentation = "https://zero-sum-sequences.readthedocs.io/"
Changelog = "https://zero-sum-sequences.readthedocs.io/en/latest/changelog.html"
Repository = "https://github.com/behackl/zero-sum-sequences"

[project.optional-dependencies]
sage = [
  "sagelite[gap]==10.9.post1",
]
tutorial = [
  "marimo>=0.25.2",
  "matplotlib>=3.8",
]

[dependency-groups]
docs = [
  "sphinx>=8.2,<10",
  "shibuya==2026.7.12",
  "myst-parser>=4,<6",
  "sphinxcontrib-bibtex>=2.6,<3",
  # Tutorial exports: wheel for the browser runtime, marimo, and ipynb export.
  "hatchling>=1.27",
  "marimo>=0.25.2",
  "matplotlib>=3.8",
  "nbformat>=5.10",
]
dev = [
  "pytest>=8.3",
  "zero-sum-sequences[tutorial]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zero_sum_sequences"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/_build"]
include = [
  "/benchmarks",
  "/CHANGELOG.md",
  "/docs",
  "/notebooks/tutorial.py",
  "/src/zero_sum_sequences",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --doctest-modules"
testpaths = ["tests", "src"]
pythonpath = ["src"]
